name: 004P Source and License Closure Research

on:
  push:
    branches:
      - research/004p-p003-source-license-closure

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    env:
      OPENSSL_RUST_USE_NASM: "0"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Collect exact package source license and native evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          rustc --version
          cargo --version

          expected_fallible_revision="9217bc5e381b54b4ef4c38959488a5dc993b7b81"
          fallible_revision="$(git ls-remote --refs https://github.com/sfackler/fallible-streaming-iterator refs/tags/v0.1.9 | awk 'NR == 1 {print $1}')"
          test "$fallible_revision" = "$expected_fallible_revision"
          export HIMSAT_FALLIBLE_STREAMING_ITERATOR_REVISION="$fallible_revision"
          echo "FALLIBLE_STREAMING_ITERATOR_TAG=v0.1.9"
          echo "FALLIBLE_STREAMING_ITERATOR_REVISION=$fallible_revision"

          native_root="$RUNNER_TEMP/himsat-004p-native"
          rm -rf "$native_root"
          mkdir -p "$native_root"

          git clone --quiet --depth 1 --branch v4.14.0 https://github.com/sqlcipher/sqlcipher "$native_root/sqlcipher"
          test "$(git -C "$native_root/sqlcipher" rev-parse refs/tags/v4.14.0)" = "46bb08ec73b2caa84b6945a19c9e435fff446dcd"
          test "$(git -C "$native_root/sqlcipher" rev-parse 'refs/tags/v4.14.0^{commit}')" = "778ab890cfc30c3631212dcceb0295498abdcd3e"
          test "$(git -C "$native_root/sqlcipher" rev-parse HEAD)" = "778ab890cfc30c3631212dcceb0295498abdcd3e"
          test "$(git -C "$native_root/sqlcipher" rev-parse HEAD:LICENSE.md)" = "3f71443161b6ff424ca4f335e910469f46ed4c44"
          test "$(git -C "$native_root/sqlcipher" rev-parse HEAD:SQLITE_LICENSE.md)" = "4029dc9e7f25d12adfa0165542d702208276913a"
          grep -Fq 'Redistribution and use in source and binary forms' "$native_root/sqlcipher/LICENSE.md"
          grep -Fq 'Neither the name of the ZETETIC LLC' "$native_root/sqlcipher/LICENSE.md"
          grep -Fq '[Public Domain](https://sqlite.org/copyright.html)' "$native_root/sqlcipher/SQLITE_LICENSE.md"

          git init --quiet "$native_root/rusqlite"
          git -C "$native_root/rusqlite" remote add origin https://github.com/rusqlite/rusqlite
          git -C "$native_root/rusqlite" fetch --quiet --depth 1 origin e88f112bef7899234a497baed5cc3c3d553deeb8
          git -C "$native_root/rusqlite" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$native_root/rusqlite" rev-parse HEAD)" = "e88f112bef7899234a497baed5cc3c3d553deeb8"
          test "$(git -C "$native_root/rusqlite" rev-parse HEAD:libsqlite3-sys/sqlcipher/sqlite3.h)" = "d1a3f170510e551a47eeb91f04addd1387bc79ab"
          test "$(git -C "$native_root/rusqlite" rev-parse HEAD:libsqlite3-sys/sqlcipher/sqlite3.c)" = "9a9d2f2034328eea3a595303ea6e8da9ffc36214"
          test "$(git -C "$native_root/rusqlite" rev-parse HEAD:libsqlite3-sys/upgrade_sqlcipher.sh)" = "a96143d098a652fae59d21d6a6cd017e0438b5e7"
          grep -Fq 'SQLCIPHER_VERSION="4.14.0"' "$native_root/rusqlite/libsqlite3-sys/upgrade_sqlcipher.sh"
          grep -Fq '#define SQLITE_VERSION        "3.51.3"' "$native_root/rusqlite/libsqlite3-sys/sqlcipher/sqlite3.h"
          grep -Fq '737ae4a34738ffa0c3ff7f9bb18df914dd1cad163f28fd6b6e114a344fe6alt1' "$native_root/rusqlite/libsqlite3-sys/sqlcipher/sqlite3.h"

          git init --quiet "$native_root/openssl-src-rs"
          git -C "$native_root/openssl-src-rs" remote add origin https://github.com/alexcrichton/openssl-src-rs
          git -C "$native_root/openssl-src-rs" fetch --quiet --depth 1 origin 64c38cc48205400720199476aff8a780f98d167d
          git -C "$native_root/openssl-src-rs" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$native_root/openssl-src-rs" rev-parse HEAD)" = "64c38cc48205400720199476aff8a780f98d167d"
          test "$(git -C "$native_root/openssl-src-rs" rev-parse HEAD:openssl)" = "aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f"
          grep -Fq 'url = https://github.com/openssl/openssl' "$native_root/openssl-src-rs/.gitmodules"

          git clone --quiet --depth 1 --branch openssl-3.6.3 https://github.com/openssl/openssl "$native_root/openssl"
          test "$(git -C "$native_root/openssl" rev-parse refs/tags/openssl-3.6.3)" = "e5c234b0c471a676ae6141d2f157df61eb293477"
          test "$(git -C "$native_root/openssl" rev-parse 'refs/tags/openssl-3.6.3^{commit}')" = "aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f"
          test "$(git -C "$native_root/openssl" rev-parse HEAD)" = "aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f"
          test "$(git -C "$native_root/openssl" rev-parse HEAD:LICENSE.txt)" = "49cc83d2ee29d13453188217f0e4edd70c7f842f"
          grep -Fq 'Apache License' "$native_root/openssl/LICENSE.txt"
          grep -Fq 'Version 2.0, January 2004' "$native_root/openssl/LICENSE.txt"

          echo "SQLCIPHER_TAG_OBJECT=46bb08ec73b2caa84b6945a19c9e435fff446dcd"
          echo "SQLCIPHER_SOURCE_REVISION=778ab890cfc30c3631212dcceb0295498abdcd3e"
          echo "SQLCIPHER_LICENSE_BLOB=3f71443161b6ff424ca4f335e910469f46ed4c44"
          echo "SQLITE_LICENSE_BLOB=4029dc9e7f25d12adfa0165542d702208276913a"
          echo "LIBSQLITE3_SYS_SOURCE_REVISION=e88f112bef7899234a497baed5cc3c3d553deeb8"
          echo "SQLITE_VERSION=3.51.3"
          echo "SQLITE_SOURCE_ID=737ae4a34738ffa0c3ff7f9bb18df914dd1cad163f28fd6b6e114a344fe6alt1"
          echo "OPENSSL_SRC_REVISION=64c38cc48205400720199476aff8a780f98d167d"
          echo "OPENSSL_TAG_OBJECT=e5c234b0c471a676ae6141d2f157df61eb293477"
          echo "OPENSSL_SOURCE_REVISION=aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f"
          echo "OPENSSL_LICENSE_BLOB=49cc83d2ee29d13453188217f0e4edd70c7f842f"

          cargo generate-lockfile --manifest-path research/004p/Cargo.toml
          cargo metadata --manifest-path research/004p/Cargo.toml --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python - "$RUNNER_TEMP/metadata.json" research/004p/Cargo.lock <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tomllib

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lock = tomllib.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          packages = [p for p in metadata["packages"] if p.get("source") is not None]
          if len(packages) != 41:
              raise SystemExit(f"expected 41 external metadata packages, found {len(packages)}")
          lock_external = [p for p in lock["package"] if p.get("source") is not None]
          if len(lock_external) != 41:
              raise SystemExit(f"expected 41 external lock packages, found {len(lock_external)}")
          lock_by_id = {(p["name"], p["version"]): p for p in lock_external}
          registry_roots = list((Path.home() / ".cargo" / "registry" / "src").glob("*"))
          if not registry_roots:
              raise SystemExit("cargo registry source root unavailable")

          verified_fallible_revision = os.environ.get("HIMSAT_FALLIBLE_STREAMING_ITERATOR_REVISION")
          if verified_fallible_revision != "9217bc5e381b54b4ef4c38959488a5dc993b7b81":
              raise SystemExit("fallible-streaming-iterator tag verification unavailable or mismatched")
          vcs_overrides = {
              ("fallible-streaming-iterator", "0.1.9"): {
                  "revision": verified_fallible_revision,
                  "source_path": ".",
                  "evidence": "verified-upstream-tag-v0.1.9",
              },
          }
          license_file_overrides = {
              ("r-efi", "6.0.0"): ["AUTHORS"],
          }

          gaps = []
          records = []
          print("=== HIMSAT_P003_P004_CLOSURE_BEGIN ===")
          for pkg in sorted(packages, key=lambda p: (p["name"], p["version"])):
              key = (pkg["name"], pkg["version"])
              locked = lock_by_id.get(key)
              dirname = f"{pkg['name']}-{pkg['version']}"
              if locked is None:
                  gaps.append(f"lock-missing:{dirname}")
                  locked = {}

              source_dir = None
              for root in registry_roots:
                  candidate = root / dirname
                  if candidate.is_dir():
                      source_dir = candidate
                      break
              if source_dir is None:
                  gaps.append(f"source-unpacked-missing:{dirname}")
                  continue

              revision = None
              source_path = None
              vcs_evidence = "cargo-vcs-info"
              vcs_path = source_dir / ".cargo_vcs_info.json"
              if vcs_path.is_file():
                  vcs = json.loads(vcs_path.read_text(encoding="utf-8"))
                  git = vcs.get("git", {})
                  revision = git.get("sha1")
                  path_in_vcs = vcs.get("path_in_vcs")
                  if not isinstance(revision, str) or len(revision) != 40:
                      gaps.append(f"vcs-revision-invalid:{dirname}")
                      revision = None
                  if path_in_vcs is not None and not isinstance(path_in_vcs, str):
                      gaps.append(f"vcs-path-invalid:{dirname}")
                      path_in_vcs = None
                  if revision:
                      source_path = path_in_vcs or "."
              elif key in vcs_overrides:
                  override = vcs_overrides[key]
                  revision = override["revision"]
                  source_path = override["source_path"]
                  vcs_evidence = override["evidence"]
              else:
                  gaps.append(f"vcs-info-missing:{dirname}")

              license_files = []
              candidates = []
              for child in sorted(source_dir.iterdir(), key=lambda p: p.name.lower()):
                  upper = child.name.upper()
                  if child.is_file() and (
                      upper.startswith("LICENSE")
                      or upper.startswith("COPYING")
                      or upper.startswith("NOTICE")
                      or upper.startswith("COPYRIGHT")
                  ):
                      candidates.append(child)
              for override_name in license_file_overrides.get(key, []):
                  override_path = source_dir / override_name
                  if override_path.is_file() and override_path not in candidates:
                      candidates.append(override_path)
              for child in sorted(candidates, key=lambda p: p.name.lower()):
                  license_files.append({
                      "name": child.name,
                      "sha256": hashlib.sha256(child.read_bytes()).hexdigest(),
                  })
              if not license_files:
                  gaps.append(f"license-files-missing:{dirname}")

              expression = pkg.get("license")
              mit_evidence = None
              if expression and "MIT" in expression:
                  mit_evidence = next((f for f in license_files if "MIT" in f["name"].upper()), None)
                  if mit_evidence is None and expression == "MIT" and license_files:
                      mit_evidence = license_files[0]
                  if mit_evidence is None and key == ("r-efi", "6.0.0"):
                      mit_evidence = next((f for f in license_files if f["name"] == "AUTHORS"), None)
              if mit_evidence is None:
                  gaps.append(f"mit-adoption-evidence-missing:{dirname}")

              record = {
                  "name": pkg["name"],
                  "version": pkg["version"],
                  "source": pkg["source"],
                  "checksum": locked.get("checksum"),
                  "license_expression": expression,
                  "selected_license": "MIT" if mit_evidence else None,
                  "selected_license_evidence": mit_evidence,
                  "repository": pkg.get("repository"),
                  "source_revision": revision,
                  "source_path": source_path,
                  "vcs_evidence": vcs_evidence,
                  "packaged_license_files": license_files,
              }
              for field in ("checksum", "license_expression", "repository", "source_revision", "source_path", "selected_license"):
                  if not record[field]:
                      gaps.append(f"metadata-{field}-missing:{dirname}")
              records.append(record)
              print(json.dumps(record, sort_keys=True, separators=(",", ":")))
          print("=== HIMSAT_P003_P004_CLOSURE_END ===")
          print("=== HIMSAT_P003_P004_GAPS_BEGIN ===")
          for gap in sorted(set(gaps)):
              print(gap)
          print("=== HIMSAT_P003_P004_GAPS_END ===")
          if gaps:
              raise SystemExit(f"provenance gaps remain: {len(set(gaps))}")

          print("=== HIMSAT_P003_P004_CANONICAL_TABLE_BEGIN ===")
          print("| Package | Version | Checksum | Repository | Revision | Path | Public expression | Adoption basis | Evidence |")
          print("| --- | --- | --- | --- | --- | --- | --- | --- | --- |")
          for record in records:
              evidence = record["selected_license_evidence"]
              print(
                  f"| `{record['name']}` | `{record['version']}` | `{record['checksum']}` | "
                  f"`{record['repository']}` | `{record['source_revision']}` | `{record['source_path']}` | "
                  f"`{record['license_expression']}` | `MIT` | `{evidence['name']} sha256:{evidence['sha256']}` |"
              )
          print("=== HIMSAT_P003_P004_CANONICAL_TABLE_END ===")
          PY
