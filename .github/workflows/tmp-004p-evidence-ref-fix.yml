name: Temporary 004P evidence-reference repair

on:
  push:
    branches: [feat/004p-p005-p006-adoption]
    paths:
      - .github/workflows/tmp-004p-evidence-ref-fix.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/004p-p005-p006-adoption
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Apply fail-closed evidence-reference repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          gate_path = Path("tools/provenance_gate.py")
          text = gate_path.read_text(encoding="utf-8")

          old_signature = """def validate_native_component(\n    policy: dict[str, Any],\n"""
          new_signature = """def validate_native_component(\n    root: Path,\n    policy: dict[str, Any],\n"""
          if text.count(old_signature) != 1:
              raise SystemExit("unexpected validate_native_component signature count")
          text = text.replace(old_signature, new_signature, 1)

          old_evidence = """    evidence_reference = legacy.safe_repo_path(component[\"evidence_reference\"], f\"{label}.evidence_reference\")\n\n"""
          new_evidence = """    evidence_reference = legacy.safe_repo_path(component[\"evidence_reference\"], f\"{label}.evidence_reference\")\n    repo_root = root.resolve()\n    evidence_path = (repo_root / evidence_reference).resolve()\n    try:\n        evidence_path.relative_to(repo_root)\n    except ValueError as exc:\n        raise GateError(f\"{label}.evidence_reference: resolves outside repository root\") from exc\n    if not evidence_path.is_file():\n        raise GateError(f\"{label}.evidence_reference: repository-local evidence file required\")\n\n"""
          if text.count(old_evidence) != 1:
              raise SystemExit("unexpected evidence_reference validation count")
          text = text.replace(old_evidence, new_evidence, 1)

          old_call = """            validate_native_component(\n                policy,\n"""
          new_call = """            validate_native_component(\n                root,\n                policy,\n"""
          if text.count(old_call) != 2:
              raise SystemExit(f"unexpected validate_native_component call count: {text.count(old_call)}")
          text = text.replace(old_call, new_call)
          gate_path.write_text(text, encoding="utf-8")

          fixture_path = Path("governance/provenance/fixtures/native-cases.json")
          payload = json.loads(fixture_path.read_text(encoding="utf-8"))
          names = {case["name"] for case in payload["cases"]}
          template = next(case["component"] for case in payload["cases"] if case["name"] == "allowed-mit-native")

          if "missing-evidence-reference-rejected" not in names:
              component = copy.deepcopy(template)
              component.update({
                  "id": "missing-evidence",
                  "name": "Missing evidence reference",
                  "evidence_reference": "specs/004-vault-key-crypto/nonexistent-native-evidence.md",
              })
              payload["cases"].append({
                  "component": component,
                  "error_contains": "repository-local evidence file required",
                  "expected": "fail",
                  "name": "missing-evidence-reference-rejected",
              })

          if "evidence-reference-path-traversal-rejected" not in names:
              component = copy.deepcopy(template)
              component.update({
                  "id": "evidence-traversal",
                  "name": "Evidence traversal",
                  "evidence_reference": "../escape.md",
              })
              payload["cases"].append({
                  "component": component,
                  "error_contains": "unsafe repository path",
                  "expected": "fail",
                  "name": "evidence-reference-path-traversal-rejected",
              })

          fixture_path.write_text(json.dumps(payload, separators=(",", ":"), sort_keys=True) + "\n", encoding="utf-8")
          PY

          python tools/provenance_gate.py validate
          python tools/provenance_gate.py check-generated
          python tools/provenance_gate.py self-test
          python tools/004p_dependency_closure.py
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-004p-evidence-ref-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/provenance_gate.py governance/provenance/fixtures/native-cases.json
          git diff --cached --check
          git commit -m "fix(004P): fail closed on native evidence references"
          git push origin HEAD:feat/004p-p005-p006-adoption
