name: R3 Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENSSL_RUST_USE_NASM: "0"

concurrency:
  group: r3-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diffcipline-r3:
    name: Diffcipline / R3 exact diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Assert exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Assert registered dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python tools/provenance_gate.py validate
          python tools/provenance_gate.py check-generated
          python tools/004p_dependency_closure.py
      - name: Diffcipline R3 proof
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          risk: R3
          run-verification: "true"
