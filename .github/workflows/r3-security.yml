name: R3 Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENSSL_RUST_USE_NASM: "0"

concurrency:
  group: r3-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diffcipline-r3:
    name: Diffcipline / R3 exact diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Checkout pinned Diffcipline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheHalfMoon/Diffcipline
          ref: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          path: .control/diffcipline
          persist-credentials: false
      - name: Assert exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Assert registered dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python tools/provenance_gate.py validate
          python tools/provenance_gate.py check-generated
          python tools/004p_dependency_closure.py
      - name: Diffcipline R3 proof with bounded 004P exception
        shell: bash
        env:
          DIFFCIPLINE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/diffcipline-r3.json"
          set +e
          cargo run --quiet --locked --manifest-path .control/diffcipline/crates/diffcipline-cli/Cargo.toml -- check --base "$DIFFCIPLINE_BASE" --risk R3 --run --json > "$proof"
          status=$?
          set -e
          cat "$proof"
          python tools/diffcipline_adoption_gate.py --proof "$proof" --exit-code "$status" --base "$DIFFCIPLINE_BASE" --risk R3
