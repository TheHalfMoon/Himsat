name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Lint
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test --workspace --all-targets --locked
      - name: Dependency-free workspace invariant
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --workspace --locked --depth 1
          packages="$(grep -c '^\[\[package\]\]$' Cargo.lock)"
          test "$packages" = "2"
          test "$(grep -c '^name = "himsat-core"$' Cargo.lock)" = "1"
          test "$(grep -c '^name = "himsat-events"$' Cargo.lock)" = "1"

  provenance:
    name: Provenance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Assert exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          python --version
      - name: Validate provenance registry
        shell: bash
        run: python tools/provenance.py validate
      - name: Generated closure
        shell: bash
        run: python tools/provenance.py check-generated

  provenance-self-test:
    name: Provenance / adversarial self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Assert exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Run fixture matrix
        shell: bash
        run: python tools/provenance.py self-test

  specgrain:
    name: SpecGrain / pinned source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Himsat revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Checkout pinned SpecGrain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheHalfMoon/SpecGrain
          ref: faddebccb4f4b1dd71bf06b1ce7e3d7b367178ed
          path: .control/specgrain
          persist-credentials: false
      - name: Validate tracked native state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          PYTHONPATH="$PWD/.control/specgrain/src" python -c 'from specgrain.cli import main; raise SystemExit(main())' check . --json

  diffcipline:
    name: Diffcipline / R2 exact diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Assert exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Diffcipline proof
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          risk: R2
          run-verification: "true"

  negative-controls:
    name: Negative controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Checkout pinned SpecGrain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheHalfMoon/SpecGrain
          ref: faddebccb4f4b1dd71bf06b1ce7e3d7b367178ed
          path: .control/specgrain
          persist-credentials: false
      - name: Checkout pinned Diffcipline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheHalfMoon/Diffcipline
          ref: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          path: .control/diffcipline
          persist-credentials: false
      - name: Assert exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Formatting failure is detected
        shell: bash
        run: |
          set -euo pipefail
          printf '\npub fn intentionally_bad_format( )->u8{0}\n' >> crates/himsat-core/src/lib.rs
          if cargo fmt --all -- --check; then
            echo "formatting negative control unexpectedly passed" >&2
            exit 1
          fi
          git restore crates/himsat-core/src/lib.rs
      - name: Clippy warning is detected
        shell: bash
        run: |
          set -euo pipefail
          printf '\npub fn intentionally_bad_clippy(value: Option<u8>) -> Option<u8> { value.map(|item| item) }\n' >> crates/himsat-core/src/lib.rs
          if cargo clippy --workspace --all-targets --locked -- -D warnings; then
            echo "clippy negative control unexpectedly passed" >&2
            exit 1
          fi
          git restore crates/himsat-core/src/lib.rs
      - name: Test failure is detected
        shell: bash
        run: |
          set -euo pipefail
          cat >> crates/himsat-core/src/lib.rs <<'EOF'

          #[cfg(test)]
          mod intentional_negative_control {
              #[test]
              fn fails_on_purpose() {
                  assert!(false);
              }
          }
          EOF
          if cargo test --workspace --all-targets --locked; then
            echo "test negative control unexpectedly passed" >&2
            exit 1
          fi
          git restore crates/himsat-core/src/lib.rs
      - name: Malformed SpecGrain state is rejected
        shell: bash
        run: |
          set -euo pipefail
          cp .specgrain/project.json "$RUNNER_TEMP/project.json"
          printf '{"store_version":999,"project_id":"himsat","policy":"default"}\n' > .specgrain/project.json
          if PYTHONPATH="$PWD/.control/specgrain/src" python -c 'from specgrain.cli import main; raise SystemExit(main())' check . --json; then
            echo "malformed SpecGrain state unexpectedly passed" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/project.json" .specgrain/project.json
      - name: Configured verification without execution is not PASS
        id: diffcipline_not_run
        continue-on-error: true
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          risk: R2
          run-verification: "false"
      - name: Assert missing verification was rejected
        if: always()
        shell: bash
        run: test "${{ steps.diffcipline_not_run.outcome }}" = "failure"
      - name: Out-of-scope working-tree change is rejected
        shell: bash
        run: |
          set -euo pipefail
          printf 'negative control\n' > unexpected-proof.txt
          if cargo run --quiet --locked --manifest-path .control/diffcipline/crates/diffcipline-cli/Cargo.toml -- check --risk R2 --run; then
            echo "out-of-scope Diffcipline negative control unexpectedly passed" >&2
            exit 1
          fi
          rm unexpected-proof.txt
