name: 004P P005 Adoption Closure Generator

on:
  push:
    branches:
      - feat/004p-p005-p006-adoption
    paths:
      - .github/workflows/004p-p005-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      OPENSSL_RUST_USE_NASM: "0"
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/004p-p005-p006-adoption
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Generate exact lock registry notices and SBOM
        shell: bash
        run: |
          set -euo pipefail
          echo "GENERATOR_INPUT_HEAD=$(git rev-parse HEAD)"
          rustc --version
          cargo --version
          python --version

          cargo generate-lockfile
          cargo fetch --locked
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"

          native_root="$RUNNER_TEMP/himsat-004p-native-notices"
          rm -rf "$native_root"
          git clone --quiet --depth 1 --branch v4.14.0 https://github.com/sqlcipher/sqlcipher "$native_root/sqlcipher"
          test "$(git -C "$native_root/sqlcipher" rev-parse 'refs/tags/v4.14.0^{commit}')" = "778ab890cfc30c3631212dcceb0295498abdcd3e"
          git clone --quiet --depth 1 --branch openssl-3.6.3 https://github.com/openssl/openssl "$native_root/openssl"
          test "$(git -C "$native_root/openssl" rev-parse 'refs/tags/openssl-3.6.3^{commit}')" = "aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f"

          python - "$RUNNER_TEMP/metadata.json" "$native_root" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          import tomllib

          root = Path.cwd()
          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          native_root = Path(sys.argv[2])
          closure_path = root / "specs/004-vault-key-crypto/provider-package-source-license-closure.md"
          evidence_reference = "specs/004-vault-key-crypto/provider-package-source-license-review-remediation.md"
          registry_source = "registry+https://github.com/rust-lang/crates.io-index"

          closure = {}
          for raw in closure_path.read_text(encoding="utf-8").splitlines():
              if not raw.startswith("| `"):
                  continue
              cols = [item.strip() for item in raw.strip().strip("|").split("|")]
              if len(cols) != 9:
                  raise SystemExit(f"invalid closure row: {raw}")
              vals = []
              for value in cols:
                  if not (value.startswith("`") and value.endswith("`")):
                      raise SystemExit(f"non-backtick closure value: {value}")
                  vals.append(value[1:-1])
              name, version, checksum, repository, revision, source_path, expression, adoption, license_evidence = vals
              if adoption != "MIT":
                  raise SystemExit(f"unexpected selected Cargo license for {name} {version}: {adoption}")
              identity = (name, version)
              if identity in closure:
                  raise SystemExit(f"duplicate closure identity: {identity}")
              closure[identity] = {
                  "checksum": checksum,
                  "repository": repository,
                  "revision": revision,
                  "source_path": source_path,
                  "expression": expression,
                  "license_evidence": license_evidence,
              }
          if len(closure) != 41:
              raise SystemExit(f"expected 41 closure records, found {len(closure)}")

          lock = tomllib.loads((root / "Cargo.lock").read_text(encoding="utf-8"))
          external_lock = [p for p in lock["package"] if p.get("source") is not None]
          if len(external_lock) != 41:
              raise SystemExit(f"expected 41 external lock packages, found {len(external_lock)}")
          lock_by_id = {(p["name"], p["version"]): p for p in external_lock}
          if set(lock_by_id) != set(closure):
              raise SystemExit("generated Cargo.lock identities differ from controlling closure")

          external_meta = [p for p in metadata["packages"] if p.get("source") is not None]
          if len(external_meta) != 41:
              raise SystemExit(f"expected 41 external metadata packages, found {len(external_meta)}")
          meta_by_id = {(p["name"], p["version"]): p for p in external_meta}
          if set(meta_by_id) != set(closure):
              raise SystemExit("Cargo metadata identities differ from controlling closure")

          sqlcipher_notice = (native_root / "sqlcipher/LICENSE.md").read_text(encoding="utf-8").strip()
          sqlite_notice = (native_root / "sqlcipher/SQLITE_LICENSE.md").read_text(encoding="utf-8").strip()
          openssl_notice = (native_root / "openssl/LICENSE.txt").read_text(encoding="utf-8").strip()

          native_by_parent = {
              ("libsqlite3-sys", "0.38.2"): [
                  {
                      "id": "sqlcipher-4.14.0",
                      "name": "SQLCipher 4.14.0",
                      "source_repository": "https://github.com/sqlcipher/sqlcipher",
                      "source_revision": "778ab890cfc30c3631212dcceb0295498abdcd3e",
                      "source_paths": ["LICENSE.md", "src"],
                      "source_license": "BSD-3-Clause",
                      "embedded_paths": ["libsqlite3-sys/sqlcipher/sqlite3.c", "libsqlite3-sys/sqlcipher/sqlite3.h"],
                      "notice": sqlcipher_notice,
                      "evidence_reference": evidence_reference,
                  },
                  {
                      "id": "sqlite-3.51.3",
                      "name": "SQLite 3.51.3 embedded in SQLCipher 4.14.0",
                      "source_repository": "https://github.com/rusqlite/rusqlite",
                      "source_revision": "e88f112bef7899234a497baed5cc3c3d553deeb8",
                      "source_paths": ["libsqlite3-sys/sqlcipher/sqlite3.c", "libsqlite3-sys/sqlcipher/sqlite3.h"],
                      "source_license": "LicenseRef-SQLite-Public-Domain",
                      "embedded_paths": ["libsqlite3-sys/sqlcipher/sqlite3.c", "libsqlite3-sys/sqlcipher/sqlite3.h"],
                      "notice": sqlite_notice,
                      "evidence_reference": evidence_reference,
                  },
              ],
              ("openssl-src", "300.6.1+3.6.3"): [
                  {
                      "id": "openssl-3.6.3",
                      "name": "OpenSSL 3.6.3",
                      "source_repository": "https://github.com/openssl/openssl",
                      "source_revision": "aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f",
                      "source_paths": ["LICENSE.txt", "crypto", "include", "providers", "ssl"],
                      "source_license": "Apache-2.0",
                      "embedded_paths": ["openssl"],
                      "notice": openssl_notice,
                      "evidence_reference": evidence_reference,
                  }
              ],
          }

          entries = []
          for identity in sorted(closure):
              name, version = identity
              selected = closure[identity]
              locked = lock_by_id[identity]
              if locked.get("source") != registry_source:
                  raise SystemExit(f"unexpected source for {name} {version}")
              if locked.get("checksum") != selected["checksum"]:
                  raise SystemExit(f"checksum drift for {name} {version}")

              package_root = Path(meta_by_id[identity]["manifest_path"]).parent
              evidence_name, separator, evidence_sha = selected["license_evidence"].partition(" sha256:")
              if not separator or not re.fullmatch(r"[0-9a-f]{64}", evidence_sha):
                  raise SystemExit(f"invalid license evidence marker for {name} {version}")
              license_path = package_root / evidence_name
              if not license_path.is_file():
                  raise SystemExit(f"selected license file missing for {name} {version}: {evidence_name}")
              observed_sha = hashlib.sha256(license_path.read_bytes()).hexdigest()
              if observed_sha != evidence_sha:
                  raise SystemExit(f"selected license digest drift for {name} {version}")
              notice = license_path.read_text(encoding="utf-8").strip()
              if not notice:
                  raise SystemExit(f"selected license notice empty for {name} {version}")

              source_path = selected["source_path"]
              if source_path == ".":
                  source_paths = ["Cargo.toml", "src"]
                  if name == "openssl-src":
                      source_paths.append("openssl")
              else:
                  source_paths = [source_path]

              entry_id = "cargo-" + re.sub(r"[^a-z0-9._-]+", "-", f"{name}-{version}".lower()).strip("-")
              entry = {
                  "id": entry_id,
                  "name": f"Cargo: {name} {version}",
                  "kind": "dependency",
                  "adoption_mode": "depend",
                  "adopted": True,
                  "source_repository": selected["repository"],
                  "source_revision": selected["revision"],
                  "source_paths": source_paths,
                  "source_license": "MIT",
                  "destination_paths": [],
                  "artifacts": [],
                  "package": {
                      "ecosystem": "cargo",
                      "name": name,
                      "version": version,
                      "source": locked["source"],
                      "checksum": locked["checksum"],
                  },
                  "notice": notice,
              }
              natives = native_by_parent.get(identity)
              if natives:
                  entry["native_components"] = natives
              entries.append(entry)

          payload = {"schema": "himsat.provenance-registry/v2", "entries": entries}
          (root / "governance/provenance/registry.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"GENERATED_REGISTRY_ENTRIES={len(entries)}")
          PY

          python tools/provenance_gate.py validate
          python tools/provenance_gate.py generate
          python tools/provenance_gate.py check-generated
          python tools/004p_dependency_closure.py
          cargo tree --workspace --locked --depth 1
          cargo tree --workspace --locked -e features > "$RUNNER_TEMP/cargo-features.txt"
          cat "$RUNNER_TEMP/cargo-features.txt"

          python - <<'PY'
          from pathlib import Path
          expected = {
              "Cargo.lock",
              "THIRD_PARTY_NOTICES.md",
              "governance/generated/sbom.json",
              "governance/provenance/registry.json",
          }
          import subprocess
          changed = {
              line[3:]
              for line in subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(f"unexpected generator change set: {sorted(changed)}")
          PY

      - name: Commit generated closure to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Himsat provenance generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock THIRD_PARTY_NOTICES.md governance/generated/sbom.json governance/provenance/registry.json
          git commit -m "build(004P): generate registered dependency closure"
          git push origin HEAD:feat/004p-p005-p006-adoption
