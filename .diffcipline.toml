version = 1

[policy]
max_changed_files = 18
max_added_lines = 900
dependency_manifest_changes = "review"
lockfile_changes = "review"
untracked_files = "fail"
expected_files = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/himsat-core/**", ".gitignore", ".github/workflows/ci.yml", ".specgrain/**", ".diffcipline.toml", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "docs/research/**", "tools/provenance.py", "governance/provenance/**", "governance/generated/**", "THIRD_PARTY_NOTICES.md", "specs/001-repository-foundation/**", "specs/002-provenance-sbom/**", "specs/CURRENT.md"]
forbidden_surfaces = [".env", "secrets/**", "vendor/**", "models/**"]

[verification]
commands = ["python tools/provenance.py validate", "python tools/provenance.py check-generated", "cargo fmt --all -- --check", "cargo test --workspace --all-targets --locked"]
r0_commands = ["cargo fmt --all -- --check"]
r1_commands = ["python tools/provenance.py validate", "python tools/provenance.py check-generated", "cargo fmt --all -- --check", "cargo test --workspace --all-targets --locked"]
r2_commands = ["python tools/provenance.py validate", "python tools/provenance.py check-generated", "python tools/provenance.py self-test", "cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --locked -- -D warnings", "cargo test --workspace --all-targets --locked"]
r3_commands = ["python tools/provenance.py validate", "python tools/provenance.py check-generated", "python tools/provenance.py self-test", "cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --locked -- -D warnings", "cargo test --workspace --all-targets --locked"]
